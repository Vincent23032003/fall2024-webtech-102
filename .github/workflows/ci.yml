name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14.x'

      - name: Install dependencies
        run: |
          cd client  # Change de répertoire vers le dossier client
          npm install

      - name: Run tests
        run: |
          cd client  # Assure-toi de rester dans le bon dossier pour les tests
          npm test
